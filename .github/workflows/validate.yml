name: Validate SkyBook data

on:
  push:
    branches: [main, rebuild]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check app.js
      - run: npm test
      - run: node scripts/validate-data.mjs --strict --club=urawa
      - run: node scripts/validate-data.mjs --strict --club=kashiwa
      - run: node scripts/validate-data.mjs --strict --club=fukuoka
      - run: node scripts/validate-data.mjs --strict --club=mito
      - run: node scripts/validate-data.mjs --strict --club=kawasaki
      - run: node scripts/validate-data.mjs --strict --club=machida
      - run: node scripts/validate-data.mjs --strict --club=fc-tokyo
      - run: node scripts/validate-data.mjs --strict --club=chiba
      - run: node scripts/validate-data.mjs --strict --club=cerezo-osaka
      - run: node scripts/validate-data.mjs --strict --club=gamba-osaka
      - run: node scripts/validate-data.mjs --strict --club=yokohama-fm
      - run: node scripts/validate-data.mjs --strict --club=nagasaki
      - run: node scripts/validate-data.mjs --strict --club=okayama
      - run: node scripts/validate-data.mjs --strict --club=kashima
      - run: node scripts/validate-data.mjs --strict --club=kobe
      - run: node scripts/validate-data.mjs --strict --club=hiroshima
      - run: node scripts/validate-data.mjs --strict --club=tokyo-verdy
      - run: node scripts/validate-data.mjs --strict --club=nagoya
      - run: node scripts/validate-data.mjs --strict --club=shimizu
      - run: node scripts/validate-data.mjs --strict --club=kyoto
