name: Validate SkyBook data

on:
  push:
    branches: [main, rebuild]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check app.js
      - run: npm test
      - run: node scripts/validate-data.mjs --strict --club=urawa
      - run: node scripts/validate-data.mjs --strict --club=kashiwa
      - run: node scripts/validate-data.mjs --strict --club=fukuoka
      - run: node scripts/validate-data.mjs --strict --club=mito
      - run: node scripts/validate-data.mjs --strict --club=kawasaki
      - run: node scripts/validate-data.mjs --strict --club=machida
